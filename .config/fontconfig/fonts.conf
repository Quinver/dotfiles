<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match>
    <test name="lang" compare="eq"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <alias binding="same"><family>sans-serif</family><prefer>
    <family>Noto Sans</family><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer>
    <family>Noto Serif</family><family>Noto Serif CJK JP</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer>
    <family>JetBrainsMono Nerd Font</family><family>Noto Sans Mono CJK JP</family><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
