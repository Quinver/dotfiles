# Colours are generated by the desktop shell from the current wallpaper.
[general]
import = ["~/.cache/qshell/alacritty.toml"]

[window]
opacity = 0.85
padding = { x = 10, y = 8 }
dynamic_padding = true

[font]
normal = { family = "JetBrainsMono Nerd Font Mono" }
size = 12

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
